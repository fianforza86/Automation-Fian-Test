name: Java Selenium Automation

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 */2 * * *' #Jalan tiap 2 jam sekali (UTC)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository (include gh-pages untuk ambil history)
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Setup Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Setup Chrome untuk Selenium
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # 4. Build dan test Maven project
      - name: Build and Test with Maven
        run: mvn clean verify

      # 5. Copy history dari gh-pages (jika ada)
      - name: Download previous Allure history
        run: |
          git fetch origin gh-pages
          git checkout origin/gh-pages -- history || echo "No previous history found"

      # 6. Generate Allure Report (gabungkan dengan history lama)
      - name: Generate Allure Report
        run: |
          npm install -g allure-commandline --save-dev
          mkdir -p target/allure-results/history
          cp -r history/* target/allure-results/history/ || true
          allure generate target/allure-results --clean -o target/allure-report

      # 7. Upload Allure Report as Artifact
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report

      # 8. Deploy Allure Report ke GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/allure-report
